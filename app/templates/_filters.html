<form class="filters" method="get"><input type="search" name="q" value="{{ request.args.get('q','') }}" placeholder="Tracking-ID oder Auftrag …"><select name="location"><option value="">Alle Standorte</option>{% for loc in locations %}<option value="{{ loc.code }}" {% if request.args.get('location')==loc.code %}selected{% endif %}>{{ loc.code }} · {{ loc.name }}</option>{% endfor %}</select>
<select name="status"><option value="">Alle Status</option>{% for s in statuses %}<option {% if request.args.get('status')==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><input type="date" name="from" value="{{ request.args.get('from','') }}"><input type="date" name="to" value="{{ request.args.get('to','') }}"><select name="unit"><option value="workdays" {% if unit=='workdays' %}selected{% endif %}>Arbeitstage</option><option value="days" {% if unit=='days' %}selected{% endif %}>Kalendertage</option><option value="hours" {% if unit=='hours' %}selected{% endif %}>Stunden</option></select><button class="btn">Filtern</button><a class="btn ghost" href="{{ request.path }}">Zurücksetzen</a></form>
