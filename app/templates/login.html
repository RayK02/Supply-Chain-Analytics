<!doctype html>
<html lang="{{ language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ t('Anmelden') }} · {{ t('Aussenlager Tracker') }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-card">
      <div class="auth-brand"><span>LT</span><div><p class="eyebrow">SUPPLY CHAIN ANALYTICS</p><h1>{{ t('Aussenlager Tracker') }}</h1></div></div>
      <h2>{{ t('Anmelden') }}</h2>
      <p class="auth-intro">{{ t('Melden Sie sich mit Ihrem freigegebenen Supabase-Konto an.') }}</p>
      {% if error %}<div class="flash error">{{ t(error) }}</div>{% endif %}
      <form method="post" class="auth-form">
        <input type="hidden" name="next" value="{{ next_url }}">
        <label>{{ t('E-Mail-Adresse') }}<input type="email" name="email" autocomplete="username" required autofocus></label>
        <label>{{ t('Passwort') }}<input type="password" name="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit">{{ t('Anmelden') }}</button>
      </form>
      <p class="auth-help">{{ t('Neue Benutzer werden durch einen Administrator in Supabase angelegt.') }}</p>
    </section>
  </main>
</body>
</html>
